<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus — a tiny Pomodoro timer</title>
<style>
  :root { --bg:#14161c; --card:#1d2029; --accent:#7dd87d; --break:#7db8d8; --text:#eef1f6; --muted:#8b93a7; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:var(--card); border-radius:20px; padding:40px 48px; text-align:center;
          box-shadow:0 12px 48px rgba(0,0,0,.45); width:340px; }
  h1 { font-size:15px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  #mode { font-size:14px; color:var(--muted); margin-bottom:18px; min-height:20px; }
  #ring { width:200px; height:200px; margin:0 auto 18px; position:relative; }
  #ring svg { transform:rotate(-90deg); }
  #time { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          font-size:44px; font-weight:600; font-variant-numeric:tabular-nums; }
  .btns { display:flex; gap:10px; justify-content:center; margin-bottom:18px; }
  button { border:none; border-radius:10px; padding:10px 20px; font-size:15px; cursor:pointer;
           background:var(--accent); color:#10131a; font-weight:600; }
  button.secondary { background:#2c313e; color:var(--text); }
  button:hover { filter:brightness(1.1); }
  .tabs { display:flex; gap:8px; justify-content:center; margin-bottom:20px; }
  .tabs button { background:#2c313e; color:var(--muted); font-size:13px; padding:8px 14px; }
  .tabs button.active { background:var(--accent); color:#10131a; }
  #count { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<div class="card">
  <h1>Focus</h1>
  <div id="mode">Pick a mode to begin</div>
  <div id="ring">
    <svg width="200" height="200">
      <circle cx="100" cy="100" r="88" fill="none" stroke="#2c313e" stroke-width="12"/>
      <circle id="prog" cx="100" cy="100" r="88" fill="none" stroke="var(--accent)"
              stroke-width="12" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="0"/>
    </svg>
    <div id="time">25:00</div>
  </div>
  <div class="tabs">
    <button data-min="25" class="active">Focus 25</button>
    <button data-min="5">Break 5</button>
    <button data-min="15">Long 15</button>
  </div>
  <div class="btns">
    <button id="toggle">Start</button>
    <button id="reset" class="secondary">Reset</button>
  </div>
  <div id="count">Sessions completed: 0</div>
</div>
<script>
  const CIRC = 553;
  let total = 25*60, left = total, timer = null, sessions = 0, isBreak = false;
  const timeEl = document.getElementById('time'),
        modeEl = document.getElementById('mode'),
        progEl = document.getElementById('prog'),
        toggleBtn = document.getElementById('toggle'),
        countEl = document.getElementById('count');

  function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  function render(){
    timeEl.textContent = fmt(left);
    progEl.style.strokeDashoffset = CIRC * (1 - left/total);
  }
  function beep(){
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = .15;
    o.start(); o.stop(ctx.currentTime + .4);
  }
  function tick(){
    if(left > 0){ left--; render(); }
    else{
      clearInterval(timer); timer = null; toggleBtn.textContent = 'Start'; beep();
      if(!isBreak){ sessions++; countEl.textContent = 'Sessions completed: '+sessions;
        modeEl.textContent = sessions % 4 === 0 ? 'Nice streak — take a long break!' : 'Focus done! Take a break.'; }
      else modeEl.textContent = 'Break over — back to focus!';
    }
  }
  toggleBtn.onclick = () => {
    if(timer){ clearInterval(timer); timer = null; toggleBtn.textContent = 'Resume'; }
    else{ timer = setInterval(tick, 1000); toggleBtn.textContent = 'Pause';
          modeEl.textContent = isBreak ? 'On break…' : 'Focusing… stay with it.'; }
  };
  document.getElementById('reset').onclick = () => {
    clearInterval(timer); timer = null; left = total; toggleBtn.textContent = 'Start'; render();
  };
  document.querySelectorAll('.tabs button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      clearInterval(timer); timer = null;
      const m = +b.dataset.min; total = left = m*60;
      isBreak = m !== 25;
      progEl.style.stroke = isBreak ? 'var(--break)' : 'var(--accent)';
      toggleBtn.textContent = 'Start';
      modeEl.textContent = isBreak ? 'Break mode' : 'Focus mode';
      render();
    };
  });
  render();
</script>
</body>
</html>
